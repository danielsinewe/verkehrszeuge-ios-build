name: Encrypted native UI verification
run-name: Native ${{ inputs.platform }} ${{ inputs.source_sha }} · ${{ inputs.payload_tag }}
on:
  workflow_dispatch:
    inputs:
      payload_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      build_number:
        required: true
        type: string
      platform:
        required: true
        type: choice
        options: [ios, android]
permissions:
  contents: read
concurrency:
  group: encrypted-native-ui-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_owner == 'danielsinewe' && github.actor == 'danielsinewe' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_BUILD: ${{ inputs.build_number }}
      NATIVE_PLATFORM: ${{ inputs.platform }}
      PAYLOAD_TAG: ${{ inputs.payload_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Select isolated private workspace
        run: echo "PRIVATE_BUILD_ROOT=$RUNNER_TEMP/private-native-ui" >> "$GITHUB_ENV"
      - name: Verify transfer code
        run: node --test envelope.test.mjs
      - name: Authenticate and decrypt the requested native packages
        id: decrypt
        env:
          GH_TOKEN: ${{ github.token }}
          VZ_INPUT_KEY: ${{ inputs.platform == 'ios' && secrets.VZ_UI_IOS_INPUT_KEY || secrets.VZ_UI_ANDROID_INPUT_KEY }}
        run: |
          set -euo pipefail
          [[ "$PAYLOAD_TAG" =~ ^ui-(ios|android)-[0-9a-f]{12}-[0-9]+-[0-9a-f]{12}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BUILD" =~ ^[1-9][0-9]*$ ]]
          mkdir -m 700 "$PRIVATE_BUILD_ROOT"
          node native-ui.mjs context-input
          gh release download "$PAYLOAD_TAG" --repo "$GITHUB_REPOSITORY" --pattern input.vzenc --dir "$PRIVATE_BUILD_ROOT"
          node envelope.mjs open-input "$PRIVATE_BUILD_ROOT/input.vzenc" "$PRIVATE_BUILD_ROOT/input.tar.gz" "$PRIVATE_BUILD_ROOT/input-context.json"
          python3 - <<'PY'
          import os, pathlib, tarfile
          root=pathlib.Path(os.environ['PRIVATE_BUILD_ROOT'])
          with tarfile.open(root/'input.tar.gz') as archive:
              archive.extractall(root,filter='data')
          PY
          node native-ui.mjs verify-input
      - name: Run iPhone assertions against the supplied native frontend
        id: ios
        if: inputs.platform == 'ios'
        continue-on-error: true
        run: node native-ui.mjs ios
      - name: Prepare disposable Android host resources
        if: inputs.platform == 'android'
        run: |
          # This is an ephemeral Linux runner, never the requesting computer.
          sudo -E python3 - <<'PY'
          import os, pathlib, shutil
          assert os.environ.get('GITHUB_ACTIONS')=='true'
          assert os.environ.get('RUNNER_OS')=='Linux'
          unused=pathlib.Path('/usr/share/dotnet')
          if unused.is_dir(): shutil.rmtree(unused)
          PY
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android assertions on its software camera
        id: android
        if: inputs.platform == 'android'
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          heap-size: 512M
          disk-size: 6G
          sdcard-path-or-size: 128M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -camera-back emulated
          script: node native-ui.mjs android
      - name: Encrypt native screenshots and diagnostic receipts
        if: always() && steps.decrypt.outcome == 'success'
        run: |
          node native-ui.mjs context-output
          tar -czf "$PRIVATE_BUILD_ROOT/output.tar.gz" -C "$PRIVATE_BUILD_ROOT/output" .
          node envelope.mjs seal-output "$PRIVATE_BUILD_ROOT/output.tar.gz" "$PRIVATE_BUILD_ROOT/result.vzenc" "$PRIVATE_BUILD_ROOT/output-context.json" "$PRIVATE_BUILD_ROOT/recipient-public.pem"
          cd "$PRIVATE_BUILD_ROOT"
          shasum -a 256 result.vzenc > result.sha256
      - name: Retain ciphertext only
        if: always() && steps.decrypt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$PAYLOAD_TAG" "$PRIVATE_BUILD_ROOT/result.vzenc" "$PRIVATE_BUILD_ROOT/result.sha256" --repo "$GITHUB_REPOSITORY"
      - name: Verify actual assertion outcome
        if: always()
        env:
          IOS_RESULT: ${{ steps.ios.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
        run: |
          if [ "$NATIVE_PLATFORM" = ios ]; then test "$IOS_RESULT" = success; else test "$ANDROID_RESULT" = success; fi
      - name: Remove disposable plaintext
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['PRIVATE_BUILD_ROOT']).resolve()
          assert root.parent==pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          if root.exists(): shutil.rmtree(root)
          PY
