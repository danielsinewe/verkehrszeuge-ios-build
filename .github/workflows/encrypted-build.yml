name: Encrypted iPhone archive
on:
  workflow_dispatch:
    inputs:
      payload_tag:
        description: Encrypted request release tag
        required: true
        type: string
      source_sha:
        description: Exact published application source SHA
        required: true
        type: string
      build_number:
        description: Unused App Store build number
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: encrypted-iphone-build
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository_owner == 'danielsinewe' && github.actor == 'danielsinewe' && github.ref == 'refs/heads/main'
    runs-on: macos-26-intel
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      PAYLOAD_TAG: ${{ inputs.payload_tag }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_BUILD: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Select disposable private workspace
        run: echo "PRIVATE_BUILD_ROOT=$RUNNER_TEMP/verkehrszeuge-private-build" >> "$GITHUB_ENV"
      - name: Test encrypted transfer boundary
        run: node --test envelope.test.mjs
      - name: Decrypt the authenticated build request
        id: decrypt
        env:
          GH_TOKEN: ${{ github.token }}
          VZ_INPUT_KEY: ${{ secrets.VZ_INPUT_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import { writeFileSync, mkdirSync } from 'node:fs';
          if (!/^ios-[0-9a-f]{12}-[1-9][0-9]{0,8}-[0-9a-f]{12}$/.test(process.env.PAYLOAD_TAG) ||
              !/^[0-9a-f]{40}$/.test(process.env.EXPECTED_SOURCE_SHA) ||
              !/^[1-9][0-9]{0,8}$/.test(process.env.EXPECTED_BUILD)) throw new Error('Invalid request selector.');
          mkdirSync(process.env.PRIVATE_BUILD_ROOT, { mode: 0o700 });
          writeFileSync(`${process.env.PRIVATE_BUILD_ROOT}/input-context.json`, JSON.stringify({sourceSha:process.env.EXPECTED_SOURCE_SHA,build:process.env.EXPECTED_BUILD,kind:'ios-build-input'}), {mode:0o600});
          JS
          gh release download "$PAYLOAD_TAG" --repo "$GITHUB_REPOSITORY" --pattern input.vzenc --dir "$PRIVATE_BUILD_ROOT"
          node envelope.mjs open-input "$PRIVATE_BUILD_ROOT/input.vzenc" "$PRIVATE_BUILD_ROOT/input.tar.gz" "$PRIVATE_BUILD_ROOT/input-context.json"
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['PRIVATE_BUILD_ROOT'])
          with tarfile.open(root/'input.tar.gz') as archive:
              archive.extractall(root, filter='data')
          PY
      - name: Build and verify the current unsigned iPhone archive
        id: compile
        continue-on-error: true
        run: node build.mjs
      - name: Encrypt archive and diagnostics for the private cloud recipient
        if: always() && steps.decrypt.outcome == 'success'
        run: |
          set -euo pipefail
          tar -czf "$PRIVATE_BUILD_ROOT/output.tar.gz" -C "$PRIVATE_BUILD_ROOT/output" .
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.PRIVATE_BUILD_ROOT}/output-context.json`, JSON.stringify({sourceSha:process.env.EXPECTED_SOURCE_SHA,build:process.env.EXPECTED_BUILD,kind:'ios-build-output'}), {mode:0o600});
          JS
          node envelope.mjs seal-output "$PRIVATE_BUILD_ROOT/output.tar.gz" "$PRIVATE_BUILD_ROOT/result.vzenc" "$PRIVATE_BUILD_ROOT/output-context.json" "$PRIVATE_BUILD_ROOT/recipient-public.pem"
          cd "$PRIVATE_BUILD_ROOT"
          shasum -a 256 result.vzenc > result.sha256
      - name: Retain only encrypted build outputs
        if: always() && steps.decrypt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$PAYLOAD_TAG" "$PRIVATE_BUILD_ROOT/result.vzenc" "$PRIVATE_BUILD_ROOT/result.sha256" --repo "$GITHUB_REPOSITORY"
      - name: Report compilation result
        if: always()
        env:
          COMPILATION_OUTCOME: ${{ steps.compile.outcome }}
        run: test "$COMPILATION_OUTCOME" = success
      - name: Remove disposable plaintext runner files
        if: always()
        run: rm -rf "$PRIVATE_BUILD_ROOT"
