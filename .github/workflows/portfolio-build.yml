name: Encrypted portfolio verification
run-name: Private ${{ inputs.job_id }} ${{ inputs.source_sha }} · ${{ inputs.payload_tag }}
on:
  workflow_dispatch:
    inputs:
      payload_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      job_id:
        required: true
        type: choice
        options: [insights, insights24, chartmeister, camera-native, slopscore, agent-eta, onecv, salesprompter]
permissions:
  contents: read
concurrency:
  group: encrypted-portfolio-quality
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository_owner == 'danielsinewe' && github.actor == 'danielsinewe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PAYLOAD_TAG: ${{ inputs.payload_tag }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.job_id == 'chartmeister' && '22' || '24' }}
      - name: Verify reviewed workflow version guards
        run: node --test reviewed-workflows.test.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: inputs.job_id == 'insights' || inputs.job_id == 'insights24'
        with:
          bun-version: '1.4.2'
      - run: echo "PRIVATE_BUILD_ROOT=$RUNNER_TEMP/private-portfolio-build" >> "$GITHUB_ENV"
      - name: Authenticate and decrypt private source
        id: decrypt
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_INPUT_KEY: ${{ secrets.QUALITY_INPUT_KEY }}
        run: |
          set -euo pipefail
          [[ "$PAYLOAD_TAG" =~ ^quality-[a-z0-9-]+-[0-9a-f]{12}-[0-9a-f]{12}$ ]]
          mkdir -m 700 "$PRIVATE_BUILD_ROOT"
          gh release download "$PAYLOAD_TAG" --repo "$GITHUB_REPOSITORY" --pattern input.vzenc --dir "$PRIVATE_BUILD_ROOT"
          node portfolio-build.mjs decrypt
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['PRIVATE_BUILD_ROOT'])
          with tarfile.open(root/'input.tar.gz') as archive:
              archive.extractall(root, filter='data')
          PY
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: inputs.job_id == 'camera-native'
        with:
          go-version-file: ${{ env.PRIVATE_BUILD_ROOT }}/source/camera-cloud/tapo/go.mod
          cache: false
      - name: Install media decoder
        if: inputs.job_id == 'camera-native'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Execute exact private checks
        id: compile
        continue-on-error: true
        run: node portfolio-build.mjs
      - name: Encrypt authenticated result
        if: always() && steps.decrypt.outcome == 'success'
        run: |
          set -euo pipefail
          tar -czf "$PRIVATE_BUILD_ROOT/output.tar.gz" -C "$PRIVATE_BUILD_ROOT/output" .
          node portfolio-build.mjs encrypt
      - name: Retain ciphertext only
        if: always() && steps.decrypt.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$PAYLOAD_TAG" "$PRIVATE_BUILD_ROOT/result.vzenc" "$PRIVATE_BUILD_ROOT/result.sha256" --repo "$GITHUB_REPOSITORY"
      - name: Verify actual result
        if: always()
        env:
          RESULT: ${{ steps.compile.outcome }}
        run: test "$RESULT" = success
      - name: Remove disposable plaintext
        if: always()
        run: rm -rf "$PRIVATE_BUILD_ROOT"
